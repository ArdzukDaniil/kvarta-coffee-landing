<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<!-- Источник картинки public/og.png: python shot.py tools/og.html --width 1200 --height 630 -->
<style>
@font-face{font-family:"Sofia XC";src:url(../public/assets/fonts/sofia-xc-cyr.woff2) format("woff2");font-weight:600 800}
@font-face{font-family:"Commissioner";src:url(../public/assets/fonts/commissioner-cyr.woff2) format("woff2");font-weight:400 700}
*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;background:#EFEDE6;color:#1D1B19;font-family:Commissioner;display:grid;grid-template-columns:1fr 470px;gap:56px;padding:64px 64px 0;overflow:hidden}
h1{font:800 112px/.84 "Sofia XC";text-transform:uppercase}
h1 em{font-style:normal;color:#C8312A}
p{margin-top:28px;font-size:26px;color:#4A453F}
.leaf{background:#fff;box-shadow:0 7px 0 -3px #fff,0 8px 0 -3px #D6D2C8,0 30px 40px -24px rgba(0,0,0,.4);align-self:start;margin-top:10px}
.head{display:flex;justify-content:space-between;padding:16px 22px;border-bottom:3px solid #1D1B19;font:600 22px/1 "Sofia XC";text-transform:uppercase;letter-spacing:.05em}
.page{padding:20px 22px 30px}
.num{font:800 250px/.8 "Sofia XC";color:#C8312A}
.day{margin-top:18px;font:800 54px/.9 "Sofia XC";text-transform:uppercase}
</style>
</head>
<body>
<div>
  <h1>Жарим<br>в <em>четверг.</em><br>В пятницу —<br>у вас.</h1>
  <p>Обжарка «Кварта», Минск · подписка и разовые заказы</p>
</div>
<div class="leaf">
  <div class="head"><span>Каждую неделю</span><span>«Кварта»</span></div>
  <div class="page"><div class="num">ЧТ</div><div class="day">Четверг — жарим<br>Пятница — везём</div></div>
</div>
</body>
</html>
